# MPCC commissioning settings; geometry comes from vehicle.yaml.
# Same numerical/footprint parameters apply to the independent evaluator.
/**:
  ros__parameters:
    horizon_nodes: 30
    dt: 0.05
    deadline: 0.035
    max_speed: 3.0
    nominal_speed: 3.0
    speed_scale: 0.5
    acceleration: 2.0
    deceleration: 3.0
    steering_rate: 2.0
    lateral_acceleration: 3.0
    # Conservative enclosing footprint, not measured axle overhangs.
    body_front: 0.50
    body_rear: 0.17
    body_width: 0.27
    clearance: 0.03
    q_contour: 30.0
    q_lag: 100.0
    q_progress: 2.0
    r_acceleration: 0.1
    r_steering_rate: 0.5
    r_steering: 0.1
    r_progress: 0.05
    progress_trust: 0.6
    max_lag: 0.25
    feasibility_tolerance: 0.005
    speed_feasibility_tolerance: 0.005
    dynamics_tolerance: 0.02
    max_input_age: 0.3
    max_input_skew: 0.1
    max_pose_jump: 1.0
    max_offset: 0.5
    search_window: 2.0
