# Experimental AutoDRIVE baseline. acados + CasADi must be installed separately.
map2_node:
  ros__parameters:
    horizon_nodes: 20
    dt: 0.05
    max_input_age: 0.5
    max_offset: 0.5
    reference_margin: 0.4  # soft corridor around raceline, NOT measured track boundaries
    stop_burst: 1.5
    steering_rate: 2.0    # rad/s
    v_x_min: 0.1
    v_y_max: 0.2
    psi_dot_max: 4.0
    q_n: 100.0
    q_dphi: 30.0
    q_v: 10.0
    r_vy: 10.0
    r_psi: 0.1
    rho: 500.0
